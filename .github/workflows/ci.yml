name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify lockfile & install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing. Failing CI."
            exit 1
          fi
          npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript validation
        run: npx tsc --noEmit

      - name: Run unit tests (if configured)
        run: npm test --if-present

      - name: Run Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload build metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-metadata-${{ github.run_number }}
          path: |
            .next/BUILD_ID
            .next/routes-manifest.json
          if-no-files-found: ignore
          retention-days: 7
